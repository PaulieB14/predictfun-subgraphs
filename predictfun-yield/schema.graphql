type RewardClaimEvent @entity(immutable: true) {
  "ID = txHash.concatI32(logIndex)"
  id: Bytes!
  account: YieldAccount!
  rewardRound: RewardRound!
  amount: BigDecimal!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type RewardDistributionEvent @entity(immutable: true) {
  "ID = txHash.concatI32(logIndex)"
  id: Bytes!
