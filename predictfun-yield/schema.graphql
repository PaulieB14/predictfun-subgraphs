type OracleRequestEvent @entity(immutable: true) {
  "ID = txHash.concatI32(logIndex)"
  id: Bytes!
  requester: Bytes!
  identifier: Bytes!
  requestTimestamp: BigInt!
  ancillaryData: Bytes!
  currency: Bytes!
  reward: BigDecimal!
  finalFee: BigDecimal!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type OracleProposalEvent @entity(immutable: true) {
  "ID = txHash.concatI32(logIndex)"
  id: Bytes!
  request: OracleRequest!
  requester: Bytes!
  proposer: Bytes!
  identifier: Bytes!
  requestTimestamp: BigInt!
  proposedPrice: BigInt!
  expirationTimestamp: BigInt!
  currency: Bytes!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type OracleSettlementEvent @entity(immutable: true) {
  "ID = txHash.concatI32(logIndex)"
  id: Bytes!
  request: OracleRequest!
  requester: Bytes!
  proposer: Bytes!
  identifier: Bytes!
  requestTimestamp: BigInt!
  price: BigInt!
  payout: BigDecimal!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
